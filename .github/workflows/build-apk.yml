name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew -maxdepth 4 | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Erreur : gradlew introuvable !"
          exit 1
        fi
        DIR=$(dirname "$GRADLEW_PATH")
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'


